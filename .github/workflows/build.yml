name: Build

on:
  push:
    branches:
      - master
      - codex/**
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            artifact_suffix: x64
          - platform: Win32
            artifact_suffix: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: py -3 -m pip install semver

      - name: Setup repository
        run: py -u scripts\setup.py

      - name: Restore NuGet packages
        run: nuget restore workspaces\foo_discord_rich.sln

      - name: Build
        shell: pwsh
        run: |
          $env:Path = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin;$env:Path"
          msbuild workspaces\foo_discord_rich.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Package
        run: py scripts\pack_component.py --configuration Release --platform ${{ matrix.platform }}

      - name: Rename artifacts
        shell: pwsh
        run: |
          $out = "_result\${{ matrix.platform }}_Release"
          Rename-Item "$out\foo_discord_rich.fb2k-component" "foo_discord_rich-${{ matrix.artifact_suffix }}.fb2k-component"
          Rename-Item "$out\foo_discord_rich_pdb.zip" "foo_discord_rich_pdb-${{ matrix.artifact_suffix }}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foo_discord_rich-${{ matrix.artifact_suffix }}
          path: |
            _result/${{ matrix.platform }}_Release/foo_discord_rich-${{ matrix.artifact_suffix }}.fb2k-component
            _result/${{ matrix.platform }}_Release/foo_discord_rich_pdb-${{ matrix.artifact_suffix }}.zip

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "_result\${{ matrix.platform }}_Release"
          gh release upload "${{ github.ref_name }}" `
            "$out\foo_discord_rich-${{ matrix.artifact_suffix }}.fb2k-component" `
            "$out\foo_discord_rich_pdb-${{ matrix.artifact_suffix }}.zip" `
            --repo "${{ github.repository }}" `
            --clobber
