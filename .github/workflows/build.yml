name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            artifact_suffix: x64
          - platform: Win32
            artifact_suffix: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install semver

      - name: Setup repository
        run: python -u scripts\setup.py

      - name: Verify release metadata
        shell: pwsh
        run: |
          python scripts\verify_release.py
          if ("${{ github.ref_type }}" -eq "tag") {
            python scripts\verify_release.py --tag "${{ github.ref_name }}"
          }

      - name: Run focused tests
        shell: cmd
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          cl /nologo /std:c++20 /EHsc /W4 /WX tests\validation_tests.cpp /I foo_discord_rich /Fe:_result\validation_tests.exe
          _result\validation_tests.exe

      - name: Restore NuGet packages
        run: nuget restore workspaces\foo_discord_rich.sln

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "[18.0,19.0)"

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $cmake = & $vswhere -latest -products * -find "Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe" | Select-Object -First 1
          if ($cmake) {
            $env:Path = "$(Split-Path $cmake -Parent);$env:Path"
          }
          msbuild workspaces\foo_discord_rich.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v145 /p:VCToolsVersion=14.51.36231

      - name: Package
        run: python scripts\pack_component.py --configuration Release --platform ${{ matrix.platform }}

      - name: Rename artifacts
        shell: pwsh
        run: |
          $out = "_result\${{ matrix.platform }}_Release"
          Rename-Item "$out\foo_discord_rich.fb2k-component" "foo_discord_rich-${{ matrix.artifact_suffix }}.fb2k-component"
          Rename-Item "$out\foo_discord_rich_pdb.zip" "foo_discord_rich_pdb-${{ matrix.artifact_suffix }}.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: foo_discord_rich-${{ matrix.artifact_suffix }}
          path: |
            _result/${{ matrix.platform }}_Release/foo_discord_rich-${{ matrix.artifact_suffix }}.fb2k-component
            _result/${{ matrix.platform }}_Release/foo_discord_rich_pdb-${{ matrix.artifact_suffix }}.zip


  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            release-assets\*.fb2k-component `
            release-assets\*.zip `
            --repo "${{ github.repository }}" `
            --clobber
